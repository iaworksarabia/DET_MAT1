<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="partyBg" x1="0%" y1="0%" x2="0%" y2="100%">
   <stop offset="0%" style="stop-color:#FF9A9E;stop-opacity:1" />
   <stop offset="100%" style="stop-color:#FECFEF;stop-opacity:1" />
  </linearGradient>
 </defs>
 <!-- Background -->
 <rect width="800" height="600" fill="url(#partyBg)"/>
 <!-- Confetti -->
 <circle cx="100" cy="100" r="5" fill="#FFD700" opacity="0.8"/>
 <rect x="200" y="50" width="10" height="10" fill="#00BFFF" transform="rotate(20 200 50)" opacity="0.8"/>
 <polygon points="700,100 710,120 690,120" fill="#FF69B4" opacity="0.8"/>
 <circle cx="600" cy="500" r="8" fill="#32CD32" opacity="0.6"/>
 <!-- Table -->
 <rect x="200" y="400" width="400" height="20" fill="#8D6E63"/>
 <rect x="220" y="420" width="20" height="100" fill="#8D6E63"/>
 <rect x="560" y="420" width="20" height="100" fill="#8D6E63"/>
 <!-- Cake -->
 <rect x="300" y="320" width="200" height="80" fill="#795548" rx="5" /> <!-- Base -->
 <rect x="290" y="260" width="220" height="60" fill="#FF4081" rx="5" /> <!-- Frosting -->
 <path d="M290 290 Q 310 310 330 290 T 370 290 T 410 290 T 450 290 T 490 290 T 510 290" fill="none" stroke="#FFF" stroke-width="3"/>
 <!-- Candles -->
 <rect x="330" y="220" width="10" height="40" fill="#2196F3" />
 <ellipse cx="335" cy="215" rx="5" ry="10" fill="#FFEB3B" /> <!-- Flame -->
 <rect x="370" y="220" width="10" height="40" fill="#4CAF50" />
 <ellipse cx="375" cy="215" rx="5" ry="10" fill="#FFEB3B" />
 <rect x="410" y="220" width="10" height="40" fill="#FFC107" />
 <ellipse cx="415" cy="215" rx="5" ry="10" fill="#FFEB3B" />
 <rect x="450" y="220" width="10" height="40" fill="#9C27B0" />
 <ellipse cx="455" cy="215" rx="5" ry="10" fill="#FFEB3B" />
 <!-- Balloons -->
 <path d="M150 250 Q 140 350 150 450" stroke="#555" stroke-width="2" fill="none"/>
 <ellipse cx="150" cy="200" rx="40" ry="50" fill="#FF5252" opacity="0.9"/>
 <path d="M650 250 Q 660 350 650 450" stroke="#555" stroke-width="2" fill="none"/>
 <ellipse cx="650" cy="200" rx="40" ry="50" fill="#448AFF" opacity="0.9"/>
</svg>
